services:
  rabbitmq:
    extends:
      file: docker-compose.base.yml
      service: rabbitmq

  db:
    extends:
      file: docker-compose.base.yml
      service: db
    build:
      context: docker/db
      dockerfile: Dockerfile
    image: ${DB_IMAGE_NAME:-iriswebapp_db}:${DB_IMAGE_TAG:-local}
    pull_policy: build


  app:
    extends:
      file: docker-compose.base.yml
      service: app
    build:
      context: .
      dockerfile: docker/webApp/Dockerfile
    image: ${APP_IMAGE_NAME:-iriswebapp_app}:${APP_IMAGE_TAG:-2.4.29-fastapi}
    pull_policy: build

  worker:
    extends:
      file: docker-compose.base.yml
      service: worker
    build:
      context: .
      dockerfile: docker/webApp/Dockerfile
    image: ${APP_IMAGE_NAME:-iriswebapp_app}:${APP_IMAGE_TAG:-2.4.29-fastapi}
    pull_policy: build


  nginx:
    extends:
      file: docker-compose.base.yml
      service: nginx
    build:
      context: docker/nginx
      dockerfile: Dockerfile
      args:
        NGINX_CONF_GID: "1234"
        NGINX_CONF_FILE: ${NGINX_CONF_FILE:-nginx.conf}
    image: ${NGINX_IMAGE_NAME:-iriswebapp_nginx}:${NGINX_IMAGE_TAG:-local}
    pull_policy: build


volumes:
  iris-downloads:
  user_templates:
  server_data:
  db_data:

networks:
  iris_backend:
    name: ${COMPOSE_PROJECT_NAME:-iris-web-utmn}_backend
  iris_frontend:
    name: ${COMPOSE_PROJECT_NAME:-iris-web-utmn}_frontend

