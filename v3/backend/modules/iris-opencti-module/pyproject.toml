[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iris-opencti-module"
version = "1.0.0"
description = "Optional OpenCTI enrichment processor for DFIR-IRIS"
requires-python = ">=3.10"
dependencies = ["iris-interface==1.2.0"]

[tool.setuptools.packages.find]
include = ["iris_opencti_module*"]
